# Generate Edith.xcodeproj with `xcodegen generate`. The project file is not
# checked in; this is the source of truth.
name: Edith
options:
  bundleIdPrefix: de.singular
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  EdithCore:
    path: Packages/EdithCore
  EdithEditor:
    path: Packages/EdithEditor
targets:
  Edith:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: EdithCore
      - package: EdithEditor
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Edith
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the newest release's appcast.xml, and the public half of
        # the EdDSA key that signs updates (the private one is in the
        # Keychain of whoever runs scripts/release.sh).
        SUFeedURL: https://github.com/mkay/edith-mac/releases/latest/download/appcast.xml
        SUPublicEDKey: 0Y6FW5RnUgQp+PJmwd/vOKi6DsNYekvfui1KyOn/VEI=
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Kreuder. GPL-3.0-or-later."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.singular.edith
        PRODUCT_NAME: Edith
        # Rendered from the Linux icon by scripts/make-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Not sandboxed: ~/.ssh, the agent socket and external editors need
        # the real filesystem. Distribution is Developer ID + notarisation.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Apple Development for local builds keeps the signature stable,
        # so Keychain items stay accessible across rebuilds. Release builds
        # will switch to Developer ID.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: Z7MGLA2YTJ
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Edith:
    build:
      targets:
        Edith: all
    test:
      targets:
        - package: EdithCore/EdithCoreTests
        - package: EdithEditor/EdithEditorTests
